[project]
name = "spect-rag"
version = "0.1.0"
description = "A readable, phased implementation of SpectRAG ingestion and retrieval"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spect_rag"]

[tool.hatch.build.targets.sdist]
include = ["src/spect_rag", "README.md", "pyproject.toml"]
