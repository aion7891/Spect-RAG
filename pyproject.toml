[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrag"
dynamic = ["version"]
description = "Unofficial implementation of SpectRAG (Sahinoglu, Mohammed, Kazangirler and Kazangirler, arXiv:2610.36991): spectral graph-augmented retrieval for multi-hop RAG. Official code: github.com/SightAndCite/SpectRAG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kumar Nishant" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["rag", "retrieval-augmented-generation", "graph", "spectral", "retrieval", "llm", "multi-hop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]                                 # exact cl100k_base token counts
pdf = ["pypdf>=4"]                                         # read .pdf files
scale = ["scipy>=1.10", "faiss-cpu>=1.8", "hnswlib>=0.8"]  # large corpora: sparse eigensolver, ANN
all = ["spectrag[tokens,pdf,scale]"]
extras = ["spectrag[all]"]                                 # older name for "all"
dev = ["pytest>=8", "build>=1"]

[project.scripts]
spectrag = "spectrag.cli:main"

[project.urls]
Homepage = "https://github.com/aion7891/Spect-RAG"
Documentation = "https://aion7891.github.io/Spect-RAG/"
Repository = "https://github.com/aion7891/Spect-RAG"
Issues = "https://github.com/aion7891/Spect-RAG/issues"
Paper = "https://arxiv.org/abs/2610.36991"
"Official implementation" = "https://github.com/SightAndCite/SpectRAG"  # by the paper's authors

[tool.setuptools.dynamic]
version = { attr = "spectrag._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
