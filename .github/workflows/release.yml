name: release

# Push a version tag on main to publish:
#   v0.1.0      -> TestPyPI, install check, then PyPI, plus a GitHub Release with the built files
#   v0.1.0rc1   -> TestPyPI and the install check only (a dry run; also a1, b1 and .dev1 tags)
# Each step runs only if the one before it passed, so a package that does not install from
# TestPyPI never reaches PyPI. Files that are already uploaded are skipped, so a failed run can
# be re-run. Publishing uses PyPI Trusted Publishing, so no API token is stored in GitHub.

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge first, then tag main."; exit 1; }
      - name: The tag must match the package version
        id: version
        run: |
          package=$(python -c "exec(open('src/spectrafuse/_version.py').read()); print(__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$package" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $package"; exit 1
          fi
          case "$package" in
            *a*|*b*|*rc*|*dev*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # Quick tests only: the tagged commit is on main, where tests.yml already ran the full set
  # (and macOS runners can queue for half an hour). Oldest and newest Python, Linux only.
  tests:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {python: "3.10", install: "."}            # numpy only
          - {python: "3.14", install: ".[all,dev]"}   # every optional extra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "${{ matrix.install }}" pytest
      - run: pytest -q -rs
      - run: python quickstart.py

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/spectrafuse/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # a re-run does not fail on files uploaded the first time

  testpypi-check:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the new version from TestPyPI and use it
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/check
          # numpy comes from PyPI; only spectrafuse itself comes from TestPyPI (--no-deps), so a
          # look-alike package on TestPyPI can never be installed in its place.
          /tmp/check/bin/pip install -q numpy
          for attempt in 1 2 3 4 5 6; do  # TestPyPI can take a minute to list a new upload
            /tmp/check/bin/pip install -q --no-deps --index-url https://test.pypi.org/simple/ \
              "spectrafuse==$version" && break
            echo "spectrafuse $version is not on TestPyPI yet (try $attempt of 6), waiting 30 s"
            sleep 30
          done
          /tmp/check/bin/spectrafuse --version | grep -x "spectrafuse $version"
          mkdir /tmp/docs
          echo "Helios Energy is based in Porto. It builds solar farms." > /tmp/docs/helios.txt
          /tmp/check/bin/spectrafuse ingest /tmp/docs --index /tmp/idx
          /tmp/check/bin/spectrafuse search "Where is Helios Energy based?" --index /tmp/idx | grep Porto

  pypi:
    needs: [check, testpypi-check]
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spectrafuse/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |  # on a re-run the release exists already: replace its files instead
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "SpectraFuse $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
