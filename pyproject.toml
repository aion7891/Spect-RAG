[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrag"
version = "0.1.0"
description = "A small, readable implementation of SpectRAG (spectral graph-augmented retrieval)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
extras = ["tiktoken", "pypdf", "scipy", "faiss-cpu", "hnswlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
