---------|\n| Aurora S1 | 2017 | Soil moisture        |\n| Aurora S2 | 2020 | Moisture and nitrogen |\n| FieldView | 2018 | Dashbo"}, {"id": 3, "x": 440.0, "y": 155.9, "doc": "aurora_labs.md", "section": "Aurora Labs > 3. Partnerships", "cluster": 2, "position": 3, "degree": 1.37, "state": "selected", "text": "## 3. Partnerships\nAurora Labs supplies sensors to River Valley Cooperative, a farming group in Portugal.\nSee river_valley_farming.md for how the cooperative uses them."}, {"id": 4, "x": 940.6, "y": 367.8, "doc": "baltic_logistics.txt", "section": "", "cluster": 3, "position": 0, "degree": 1.067, "state": "selected", "text": "Baltic Logistics is a shipping and storage company based in Gdansk.\nIts chief executive is Anna Kowalska, who has run the company since 2016.\nThe company bought a robot maker in 2020 to automate its warehouses.\nBy 2023 its ports in Gdansk and Rotterdam used more than 900 robots, and yearly revenue reached 2.1 billion euros."}, {"id": 5, "x": 315.8, "y": 409.1, "doc": "coimbra_university.md", "section": "University of Coimbra > History", "cluster": 0, "position": 0, "degree": 1.193, "state": "selected", "text": "# University of Coimbra\n## History\nThe University of Coimbra is one of the oldest universities in Europe.\nIt was founded in 1290 and has faculties of law, medicine, science and economics."}, {"id": 6, "x": 303.2, "y": 236.5, "doc": "coimbra_university.md", "section": "University of Coimbra > Alumni", "cluster": 0, "position": 1, "degree": 1.188, "state": "selected", "text": "## Alumni\nMaya Chen studied physics at the University of Coimbra and wrote her thesis on soil sensors.\nTomas Ruiz studied business at the same university, where the two met in 2011."}, {"id": 7, "x": 76.4, "y": 390.9, "doc": "douro_wine_guild.md", "section": "Douro Wine Guild > Members", "cluster": 2, "position": 0, "degree": 1.077, "state": "selected", "text": "# Douro Wine Guild\n## Members\nThe Douro Wine Guild is a group of wine makers in northern Portugal.\nThe guild buys grapes from River Valley Cooperative and from about forty other growers."}, {"id": 8, "x": 12.8, "y": 581.0, "doc": "douro_wine_guild.md", "section": "Douro Wine Guild > Events", "cluster": 2, "position": 1, "degree": 0.662, "state": "selected", "text": "## Events\nEvery September the guild organises the Douro Harvest Festival in Peso da R\u00e9gua.\nVisitors can taste new wines and watch grapes being pressed by foot."}, {"id": 9, "x": 560.9, "y": 582.1, "doc": "evora_solar_park.md", "section": "\u00c9vora Solar Park > Site", "cluster": 3, "position": 0, "degree": 1.15, "state": "selected", "text": "# \u00c9vora Solar Park\n## Site\nThe \u00c9vora Solar Park is the largest site operated by Helios Energy.\nIt opened in 2020 on former wheat fields east of \u00c9vora.\nThe park is managed by Pedro Alves.\n## Equipment\nThe park uses 180,000 Sunforge X7 panels.\nThe panels turn to follow the sun from east to west during the day."}, {"id": 10, "x": 404.0, "y": 541.1, "doc": "greenhouse_basics.txt", "section": "", "cluster": 1, "position": 0, "degree": 1.062, "state": "selected", "text": "Greenhouse farming needs careful control of water and heat.\nMany growers place soil sensors near the roots of their plants.\nThe sensors measure how wet the soil is, and the readings help farmers decide when to water.\nDrip irrigation brings water straight to the roots through thin pipes.\nTogether with sensors, it can reduce waste and protect plants from disease.\nMost modern greenhouses also use fan"}, {"id": 11, "x": 701.8, "y": 397.0, "doc": "helios_energy.txt", "section": "", "cluster": 3, "position": 0, "degree": 1.738, "state": "selected", "text": "Helios Energy is a solar power company based in Porto.\nIt was founded in 2011 and builds solar farms for small towns in southern Europe.\nIn 2019 Helios Energy hired Maya Chen as chief technology officer.\nUnder her lead the company started using soil and weather sensors to plan where new solar panels should be placed.\nThis work led to the Helios Grid Planner, a tool released in 2021.\nThe Helios Gri"}, {"id": 12, "x": 1019.8, "y": 633.0, "doc": "helios_energy.txt", "section": "", "cluster": 3, "position": 1, "degree": 0.475, "state": "selected", "text": "It predicts how much energy a site will produce over a year.\nEngineers use it before they buy land for a new farm.\nBy 2023 Helios Energy operated 35 solar farms.\nIts largest site, near \u00c9vora, produces enough electricity for about 60,000 homes."}, {"id": 13, "x": -4.3, "y": -17.9, "doc": "lucia_ferreira.txt", "section": "", "cluster": 0, "position": 0, "degree": 0.212, "state": "selected", "text": "Lucia Ferreira grew up in Seville and studied mechanical engineering."}, {"id": 14, "x": 500.5, "y": 371.0, "doc": "lucia_ferreira.txt", "section": "", "cluster": 3, "position": 1, "degree": 1.532, "state": "selected", "text": "For six years she was an engineer at Nordwind Robotics, where she designed the arm of a warehouse robot.\nIn 2022 she moved to Madrid to lead a new team.\nHer first project there was the Aurora Drone, a small aircraft that maps fields from the air.\nThe drone was released in 2023 and is now used on more than 300 farms."}, {"id": 15, "x": 822.9, "y": 428.1, "doc": "nordwind_robotics.md", "section": "Nordwind Robotics > Company", "cluster": 3, "position": 0, "degree": 1.117, "state": "selected", "text": "# Nordwind Robotics\n## Company\nNordwind Robotics is a robot maker based in Hamburg.\nIt was founded in 2008 by Klaus Berger, a former ship engineer.\nIts main product is the Nordwind Carrier, a robot that moves boxes inside warehouses.\n## Ownership\nIn 2020 Nordwind Robotics was acquired by Baltic Logistics.\nThe robot maker kept its name and its factory in Hamburg."}, {"id": 16, "x": 262.0, "y": 341.2, "doc": "river_valley_farming.md", "section": "River Valley Cooperative > Members", "cluster": 2, "position": 0, "degree": 1.707, "state": "selected", "text": "# River Valley Cooperative\n## Members\nRiver Valley Cooperative is a group of 120 family farms in the Douro valley, Portugal.\nThe farms grow grapes, olives, and vegetables.\nThe cooperative was created in 2009 to share equipment and sell produce together."}, {"id": 17, "x": 514.8, "y": 284.1, "doc": "river_valley_farming.md", "section": "River Valley Cooperative > Irrigation", "cluster": 2, "position": 1, "degree": 1.754, "state": "selected", "text": "## Irrigation\nWater is scarce in summer, so the cooperative installed Aurora S1 sensors on every member farm in 2018.\nFarmers check the readings in FieldView each morning.\nSince then the cooperative reports using 30 percent less water while keeping the same harvest size.\n## Plans\nThe cooperative plans to add the Aurora S2 sensor to track nitrogen in the soil.\nThis should help farmers use less fert"}, {"id": 18, "x": 792.9, "y": 758.5, "doc": "solar_power_overview.md", "section": "Solar Power > How it works", "cluster": 3, "position": 0, "degree": 0.676, "state": "selected", "text": "# Solar Power\n## How it works\nSolar panels turn sunlight into electricity.\nA solar farm connects thousands of panels to the power grid.\nPlanners study weather and land before they build a new farm."}, {"id": 19, "x": 749.5, "y": 557.7, "doc": "solar_power_overview.md", "section": "Solar Power > Companies", "cluster": 3, "position": 1, "degree": 0.949, "state": "selected", "text": "## Companies\nMany energy companies in southern Europe build solar farms because the region gets strong sunshine.\nSome companies hire experts in sensors and data to choose the best sites, and some appoint a chief technology officer to lead this work."}, {"id": 20, "x": 666.0, "y": 265.6, "doc": "sunforge_panels.txt", "section": "", "cluster": 3, "position": 0, "degree": 1.029, "state": "selected", "text": "Sunforge is a maker of solar panels based in Valencia.\nThe company was founded in 2012 and is led by Marta Silva."}, {"id": 21, "x": 562.3, "y": 476.1, "doc": "sunforge_panels.txt", "section": "", "cluster": 3, "position": 1, "degree": 1.082, "state": "selected", "text": "Its best-known product is the Sunforge X7, a panel designed for hot and dry regions.\nSunforge sells most of its panels to solar farms in Spain and Portugal."}, {"id": 22, "x": 555.8, "y": 53.7, "doc": "tomas_ruiz.md", "section": "Tomas Ruiz > Career", "cluster": 0, "position": 0, "degree": 1.305, "state": "selected", "text": "# Tomas Ruiz\n## Career\nTomas Ruiz is the chief executive of Aurora Labs.\nHe co-founded the company in 2014 and has led it alone since 2019.\nBefore that he worked as a buyer for a supermarket chain in Lisbon."}, {"id": 23, "x": 311.8, "y": 115.2, "doc": "tomas_ruiz.md", "section": "Tomas Ruiz > Expansion", "cluster": 0, "position": 1, "degree": 1.419, "state": "selected", "text": "## Expansion\nIn 2022 Aurora Labs opened an office in Madrid.\nThe Madrid office is led by Lucia Ferreira and builds software for large farms in Spain.\nRuiz says the office doubled the number of customers within two years."}, {"id": 24, "x": 264.6, "y": 1050.0, "doc": "warehouse_robots.txt", "section": "", "cluster": 1, "position": 0, "degree": 0.136, "state": "selected", "text": "Warehouse robots carry boxes between shelves and packing stations.\nThey help companies ship orders faster and reduce heavy lifting for workers."}, {"id": 25, "x": 421.3, "y": 739.4, "doc": "warehouse_robots.txt", "section": "", "cluster": 1, "position": 1, "degree": 0.711, "state": "selected", "text": "Most warehouse robots follow markers on the floor or use cameras to find their way.\nLarge shipping companies often buy robot makers to control the technology they depend on, and the robot makers usually keep their own engineers and factories."}], "edges": [[0, 1, 0.177, "adjacency"], [0, 2, 0.095, "semantic"], [0, 3, 0.239, "section"], [0, 4, 0.08, "semantic"], [0, 6, 0.147, "semantic"], [0, 11, 0.173, "semantic"], [0, 14, 0.083, "semantic"], [0, 15, 0.074, "semantic"], [0, 19, 0.065, "semanti     `<label><input type="checkbox" checked data-s="${s}"><span class="sw" style="background:${css("--s" + k)}"></span>${s}` +
    ` <span style="color:var(--muted)">(${D.edges.filter(e => e[3] === s).length})</span></label>`).join("");
  document.querySelectorAll("#edgeLegend input").forEach(b => b.onchange = () => { b.checked ? shown.add(b.dataset.s) : shown.delete(b.dataset.s); draw(); });
}
let focus = null;
function draw() {
  const E = document.getElementById("edges"), N = document.getElementById("nodes"); E.innerHTML = N.innerHTML = "";
  const maxDeg = Math.max(...D.nodes.map(n => n.degree), 1e-9), r = D.nodes.length > 400 ? 4 : 7;
  D.edges.forEach(([i, j, w, s]) => { if (!shown.has(s)) return; const a = byId[i], b = byId[j], l = document.createElementNS(NS, "line");
    l.setAttribute("x1", a.x); l.setAttribute("y1", a.y); l.setAttribute("x2", b.x); l.setAttribute("y2", b.y);
    l.setAttribute("class", "e" + (focus !== null && i !== focus && j !== focus ? " dim" : ""));
    l.setAttribute("stroke", css("--s" + D.signals.indexOf(s))); l.setAttribute("stroke-width", 0.6 + 2.5 * w); l.setAttribute("stroke-opacity", .35 + .5 * w); E.appendChild(l); });
  D.nodes.forEach(n => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", n.x); c.setAttribute("cy", n.y);
    c.setAttribute("r", r * (0.7 + 0.8 * Math.sqrt(n.degree / maxDeg)) * (n.state === "selected" ? 1.35 : 1));
    c.setAttribute("fill", colour(n)); c.setAttribute("class", "n" + (focus !== null && n.id !== focus && !(neighbours[focus] || new Set()).has(n.id) ? " dim" : ""));
    c.onmousemove = ev => tip(ev, n); c.onmouseleave = () => tipEl.style.display = "none";
    c.onclick = ev => { ev.stopPropagation(); focus = focus === n.id ? null : n.id; draw(); }; N.appendChild(c); });
}
const tipEl = document.getElementById("tip");
function tip(ev, n) {
  const state = STATE[n.state][1];
  tipEl.innerHTML = `<b>${n.doc} · chunk ${n.id}</b>${n.section ? n.section + "<br>" : ""}cluster ${n.cluster} · ` +
    `weighted degree ${n.degree} · ${state}<div class="t">${n.text.replace(/</g, "&lt;")}…</div>`;
  tipEl.style.display = "block"; tipEl.style.left = Math.min(ev.clientX + 14, innerWidth - 360) + "px"; tipEl.style.top = (ev.clientY + 14) + "px";
}
const svg = document.getElementById("view"), Z = document.getElementById("zoom"); let view = {x: -40, y: -40, w: 1080, h: 1080}, drag = null;
const setView = () => svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); setView();
svg.onwheel = ev => { ev.preventDefault(); const f = ev.deltaY > 0 ? 1.15 : 1 / 1.15, b = svg.getBoundingClientRect();
  const px = view.x + (ev.clientX - b.left) / b.width * view.w, py = view.y + (ev.clientY - b.top) / b.height * view.h;
  view = {x: px - (px - view.x) * f, y: py - (py - view.y) * f, w: view.w * f, h: view.h * f}; setView(); };
svg.onpointerdown = ev => drag = {x: ev.clientX, y: ev.clientY, v: {...view}};
svg.onpointermove = ev => { if (!drag) return; const b = svg.getBoundingClientRect();
  view.x = drag.v.x - (ev.clientX - drag.x) / b.width * view.w; view.y = drag.v.y - (ev.clientY - drag.y) / b.height * view.h; setView(); };
svg.onpointerup = svg.onpointerleave = () => drag = null; svg.onclick = () => { focus = null; draw(); };
document.getElementById("mode").onchange = () => { nodeLegend(); draw(); };
const list = document.getElementById("picked");
if (!D.picked.length) document.getElementById("pathBox").innerHTML = '<h2>Selected context</h2><div class="sub">Give a question to see the retrieval path.</div>';
D.picked.forEach(p => { const li = document.createElement("li"); li.textContent = `${p.doc} (chunk ${p.id}) · ${p.reason} · score ${p.score}`;
  li.onclick = () => { focus = p.id; draw(); }; list.appendChild(li); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { nodeLegend(); edgeLegend(); draw(); });
nodeLegend(); edgeLegend(); draw();
</script></body></html>
