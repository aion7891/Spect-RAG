# Publishes the interactive explainers (docs/interactive/) and the example graph view to
# GitHub Pages: https://aion7891.github.io/Spect-RAG/
# The GitBook documentation embeds and links these pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: interactive pages

on:
  push:
    branches: [main]
    paths:
      - "docs/interactive/**"
      - "examples/graph_view.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the pages
        run: |
          mkdir site
          cp docs/interactive/*.html site/
          cp examples/graph_view.html site/graph-view.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
